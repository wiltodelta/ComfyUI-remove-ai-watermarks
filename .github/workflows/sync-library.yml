name: Sync remove-ai-watermarks

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      library_version:
        description: "Published remove-ai-watermarks version to synchronize. Blank uses the latest PyPI release."
        required: false
        type: string

concurrency:
  group: sync-remove-ai-watermarks
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.node.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve published versions
        id: versions
        env:
          REQUESTED_LIBRARY_VERSION: ${{ inputs.library_version }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_LIBRARY_VERSION" ]; then
            library_version=$REQUESTED_LIBRARY_VERSION
          else
            library_version=$(curl -fsSL https://pypi.org/pypi/remove-ai-watermarks/json \
              | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])")
          fi
          release_visible=false
          for attempt in $(seq 1 30); do
            if curl -fsSL "https://pypi.org/pypi/remove-ai-watermarks/$library_version/json" >/dev/null; then
              release_visible=true
              break
            fi
            echo "Published release is not visible on PyPI yet (attempt $attempt)"
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done
          if [ "$release_visible" != true ]; then
            echo "::error::remove-ai-watermarks $library_version did not become visible on PyPI"
            exit 1
          fi
          registry_version=$(curl -fsSL https://api.comfy.org/nodes/remove-ai-watermarks/versions \
            | python -c "import json,sys; print(max(json.load(sys.stdin), key=lambda row: tuple(map(int, row['version'].split('.'))))['version'])")
          echo "library=$library_version" >> "$GITHUB_OUTPUT"
          echo "registry=$registry_version" >> "$GITHUB_OUTPUT"
      - name: Synchronize package metadata
        env:
          LIBRARY_VERSION: ${{ steps.versions.outputs.library }}
        run: |
          python scripts/sync_library_version.py --library-version "$LIBRARY_VERSION"
      - name: Resolve node version
        id: node
        env:
          REGISTRY_VERSION: ${{ steps.versions.outputs.registry }}
        run: |
          set -euo pipefail
          node_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          publish=$(
            python - "$node_version" "$REGISTRY_VERSION" <<'PY'
          import sys

          node = tuple(map(int, sys.argv[1].split(".")))
          registry = tuple(map(int, sys.argv[2].split(".")))
          if node < registry:
              raise SystemExit("Local node version is older than the registry")
          print(str(node > registry).lower())
          PY
          )
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$node_version" >> "$GITHUB_OUTPUT"
      - name: Test against the published library
        if: steps.node.outputs.publish == 'true'
        env:
          LIBRARY_VERSION: ${{ steps.versions.outputs.library }}
        run: bash scripts/test.sh
      - name: Commit synchronized metadata
        if: steps.node.outputs.publish == 'true'
        env:
          LIBRARY_VERSION: ${{ steps.versions.outputs.library }}
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet -- pyproject.toml requirements.txt; then
            echo "Package metadata already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml requirements.txt
          git commit -m "Sync remove-ai-watermarks $LIBRARY_VERSION"
          git push

  # GITHUB_TOKEN pushes do not start push-triggered workflows, so the sync calls
  # the shared publisher explicitly. checkout_ref must be main because a reusable
  # workflow otherwise checks out the caller's pre-sync SHA.
  publish:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      run_tests: false
      checkout_ref: main
    secrets: inherit
